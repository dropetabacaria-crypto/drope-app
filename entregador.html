<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DROPE Moto">
<meta name="theme-color" content="#0A0A14">
<title>DROPE ✦ Entregador</title>
<link rel="manifest" href="/manifest-entregador.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-entregador.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/app-entregador-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0A0A14; --bg2:#12121f; --bg3:#1b1b2b; --fg:#F5F3FF; --fg-dim:#9a97b5; --border:rgba(255,255,255,0.10); --lime:#D4FF2E; --pink:#FF2D6F; --purple:#8C50FF; --green:#4ADE80; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:'Inter',system-ui,sans-serif; font-weight:500; min-height:100vh; overflow-x:hidden; }
  body { display:flex; justify-content:center; }
  /* aurora de fundo, igual o app */
  body::before { content:''; position:fixed; inset:0; z-index:0; background:
    radial-gradient(50% 40% at 15% 0%, rgba(140,80,255,0.20), transparent 60%),
    radial-gradient(45% 35% at 100% 12%, rgba(255,45,111,0.16), transparent 60%),
    radial-gradient(50% 40% at 60% 100%, rgba(212,255,46,0.06), transparent 60%); pointer-events:none; }
  .app { position:relative; z-index:1; width:100%; max-width:480px; min-height:100vh; padding:0 16px 40px; }
  .top { display:flex; align-items:center; gap:11px; padding:18px 4px 12px; }
  .logo { width:38px; height:38px; border-radius:11px; object-fit:cover; box-shadow:0 4px 14px rgba(255,45,111,0.3); }
  .brand { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:19px; }
  .brand b { color:var(--lime); }

  /* ===== Hero (auth) ===== */
  .hero { position:relative; overflow:hidden; border-radius:22px; padding:20px 18px; margin:6px 0 16px; display:flex; align-items:center; gap:14px;
    background:linear-gradient(135deg,#241046 0%, #4A1A6E 52%, #8A2A6B 100%); box-shadow:0 14px 34px rgba(74,26,110,0.40); }
  .hero::after { content:''; position:absolute; inset:0; background:radial-gradient(80% 70% at 100% 40%, rgba(255,45,111,0.22), transparent 62%); pointer-events:none; }
  .hero-txt { position:relative; z-index:2; flex:1; min-width:0; }
  .hero-title { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:23px; color:#fff; letter-spacing:-0.5px; }
  .hero-sub { font-size:13px; color:rgba(255,255,255,0.9); line-height:1.4; margin-top:5px; }
  .hero-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .hero-chip { font-size:11px; font-weight:700; color:#fff; background:rgba(0,0,0,0.26); border:1px solid rgba(255,255,255,0.20); border-radius:999px; padding:5px 10px; }
  .hero-img { position:relative; z-index:2; flex:0 0 auto; width:88px; height:88px; border-radius:50%; object-fit:cover; box-shadow:0 10px 24px rgba(0,0,0,0.45), 0 0 0 3px rgba(255,255,255,0.16), 0 0 26px rgba(255,45,111,0.4); }

  .tabs { display:flex; gap:8px; margin:4px 0 8px; background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:5px; }
  .tab { flex:1; padding:11px; border-radius:10px; border:0; background:transparent; color:var(--fg-dim); font-family:inherit; font-weight:800; font-size:14px; cursor:pointer; transition:.15s; }
  .tab.active { background:var(--lime); color:#0A0A14; }
  label { display:block; font-size:12px; color:var(--fg-dim); font-weight:700; margin:13px 4px 6px; }
  input { width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:15px; color:var(--fg); font-size:16px; font-family:inherit; outline:none; transition:border-color .15s; }
  input:focus { border-color:var(--purple); }
  .btn { width:100%; background:var(--lime); color:#0A0A14; border:0; border-radius:14px; padding:16px; font-size:16px; font-weight:800; font-family:inherit; cursor:pointer; margin-top:18px; box-shadow:0 6px 18px rgba(212,255,46,0.25); transition:transform .12s; }
  .btn:active { transform:scale(0.98); }
  .btn.sec { background:var(--bg3); color:var(--fg-dim); box-shadow:none; }
  .btn.pink { background:var(--pink); color:#fff; box-shadow:0 6px 18px rgba(255,45,111,0.3); }
  .btn:disabled { opacity:.5; }
  .msg { font-size:13px; color:var(--pink); margin:12px 4px 0; min-height:16px; text-align:center; }
  .hint { font-size:11px; color:var(--fg-dim); margin:6px 4px 0; line-height:1.4; }
  .hidden { display:none; }

  /* ===== Corridas ===== */
  .hdr-row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:2px 4px 14px; }
  .hdr-name { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:19px; }
  .sair { font-size:12px; color:var(--pink); font-weight:800; cursor:pointer; flex:0 0 auto; }
  /* card de ganhos */
  .earn { position:relative; overflow:hidden; border-radius:20px; padding:18px; margin-bottom:14px;
    background:linear-gradient(135deg,#143d2a 0%, #1c5c3a 55%, #2b7d4a 100%); box-shadow:0 12px 30px rgba(28,92,58,0.35); }
  .earn::after { content:''; position:absolute; inset:0; background:radial-gradient(80% 80% at 100% 0%, rgba(212,255,46,0.22), transparent 60%); pointer-events:none; }
  .earn-lbl { position:relative; z-index:2; font-size:12px; font-weight:700; color:rgba(255,255,255,0.8); text-transform:uppercase; letter-spacing:1px; }
  .earn-big { position:relative; z-index:2; font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:34px; color:#fff; margin-top:2px; letter-spacing:-1px; }
  .earn-row { position:relative; z-index:2; display:flex; gap:16px; margin-top:8px; font-size:13px; color:rgba(255,255,255,0.92); }
  .earn-row b { color:#fff; }
  .seg { display:flex; gap:8px; margin-bottom:14px; background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:5px; }
  .seg button { flex:1; padding:10px; border-radius:10px; border:0; background:transparent; color:var(--fg-dim); font-family:inherit; font-weight:800; font-size:13.5px; cursor:pointer; transition:.15s; }
  .seg button.active { background:var(--bg3); color:var(--fg); box-shadow:inset 0 0 0 1px var(--border); }
  .card { position:relative; overflow:hidden; background:var(--bg2); border:1px solid var(--border); border-radius:18px; padding:15px; margin-bottom:12px; box-shadow:0 8px 22px rgba(0,0,0,0.30); }
  .card.mine { border-color:rgba(212,255,46,0.4); box-shadow:0 8px 22px rgba(0,0,0,0.30), 0 0 20px rgba(212,255,46,0.08); }
  .c-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .c-loja { font-family:'Space Grotesk',sans-serif; font-weight:800; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .c-valor { font-family:'Space Grotesk',sans-serif; font-weight:800; color:var(--lime); font-size:18px; flex:0 0 auto; }
  .c-badges { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .c-badge { font-size:11px; font-weight:800; padding:4px 10px; border-radius:999px; }
  .b-aberta { background:rgba(255,184,0,0.16); color:#ffcf4d; }
  .b-aceita { background:rgba(140,80,255,0.2); color:#c8b6ff; }
  .b-rota { background:rgba(212,255,46,0.16); color:var(--lime); }
  .b-avulso { background:rgba(45,212,255,0.16); color:#7fe3ff; }
  .b-fixo { background:rgba(74,222,128,0.16); color:var(--green); }
  .c-line { font-size:13px; color:var(--fg-dim); margin-top:9px; line-height:1.4; display:flex; gap:7px; align-items:flex-start; }
  .c-line b { color:var(--fg); font-weight:700; }
  .c-acts { display:flex; gap:8px; margin-top:13px; }
  .c-acts .btn { margin-top:0; padding:13px; font-size:14px; }
  .maps { color:var(--purple); font-weight:700; text-decoration:none; }
  .zap { color:var(--green); font-weight:700; text-decoration:none; }
  .empty { text-align:center; color:var(--fg-dim); font-size:14px; padding:44px 12px; line-height:1.6; }
  /* extrato */
  .hist-item { display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--bg2); border:1px solid var(--border); border-radius:13px; padding:12px 14px; margin-bottom:8px; }
  .hist-loja { font-weight:700; font-size:14px; }
  .hist-when { font-size:11px; color:var(--fg-dim); margin-top:2px; }
  .hist-val { font-family:'Space Grotesk',sans-serif; font-weight:800; color:var(--green); font-size:15px; }

  /* ===== DROPE FUTURISTA — grid pontilhado + vidro (Ai OS) ===== */
  body { background: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1.5px) 0 0 / 23px 23px, var(--bg) !important; }
  .card, .hist-item, .tabs, .seg {
    background: linear-gradient(158deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015) 60%), var(--bg2) !important;
    border: 1px solid var(--border) !important;
  }
  .card { border-radius: 20px !important; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <img class="logo" src="icons/drope-avatar.png" alt="">
    <div class="brand">DRO<b>PE</b> ✦ Entregas</div>
  </div>

  <!-- AUTH -->
  <div id="auth-screen">
    <div class="hero">
      <div class="hero-txt">
        <div class="hero-title">App do entregador ✦</div>
        <div class="hero-sub">Faça entregas das lojas DROPE e ganhe por corrida.</div>
        <div class="hero-chips">
          <span class="hero-chip"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="5.5" cy="17.5" r="2.5"/><circle cx="17" cy="17.5" r="2.5"/><path d="M8 17.5h6.5l-3.3-8H8.2"/><path d="M11.2 9.5H15l2 5"/><path d="M3.5 9.5h3"/></svg> Fixo + avulso</span>
          <span class="hero-chip"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M13 3 5 13h6l-1 8 8-11h-6l1-7Z"/></svg> Recebe no Pix</span>
        </div>
      </div>
      <img class="hero-img" src="icons/camaleao-olho.webp" alt="">
    </div>
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="setTab('login')">Entrar</button>
      <button class="tab" id="tab-signup" onclick="setTab('signup')">Criar conta</button>
    </div>

    <div id="form-login">
      <label>Telefone (WhatsApp)</label>
      <input id="lg-phone" type="tel" inputmode="tel" placeholder="(11) 91234-5678">
      <label>Senha</label>
      <div style="position:relative">
        <input id="lg-pass" type="password" placeholder="Sua senha" style="padding-right:48px">
        <span onclick="_togglePw('lg-pass',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:19px;line-height:1;user-select:none;opacity:.85"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></span>
      </div>
      <button class="btn" id="btn-login" onclick="doLogin()">Entrar ✦</button>
    </div>

    <div id="form-signup" class="hidden">
      <label>Seu nome</label>
      <input id="sg-nome" placeholder="ex: João Silva" maxlength="40">
      <label>Telefone (WhatsApp)</label>
      <input id="sg-phone" type="tel" inputmode="tel" placeholder="(11) 91234-5678">
      <label>Chave Pix (pra receber)</label>
      <input id="sg-pix" placeholder="CPF, telefone, email ou aleatória">
      <label>Crie uma senha</label>
      <div style="position:relative">
        <input id="sg-pass" type="password" placeholder="mín. 4 caracteres" style="padding-right:48px">
        <span onclick="_togglePw('sg-pass',this)" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:19px;line-height:1;user-select:none;opacity:.85"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></span>
      </div>
      <button class="btn" id="btn-signup" onclick="doSignup()">Criar conta ✦</button>
      <div class="hint">Sua chave Pix é usada pro repasse das entregas avulsas.</div>
    </div>
    <div class="msg" id="auth-msg"></div>
  </div>

  <!-- CORRIDAS -->
  <div id="corridas-screen" class="hidden">
    <div class="hdr-row">
      <div class="hdr-name" id="ent-nome">—</div>
      <span class="sair" onclick="sair()">Sair</span>
    </div>

    <div id="online-bar" onclick="toggleOnline()" style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;padding:14px 16px;border-radius:16px;cursor:pointer;border:1px solid var(--border);background:var(--bg2)">
      <div style="display:flex;align-items:center;gap:11px">
        <span id="online-dot" style="width:12px;height:12px;border-radius:50%;background:#6b6b7a;flex:0 0 auto"></span>
        <div><div id="online-label" style="font-weight:800;font-size:15px">Offline</div><div id="online-sub" style="font-size:12px;color:var(--fg-dim)">Toque pra ficar disponível</div></div>
      </div>
      <span id="online-switch" style="width:46px;height:28px;border-radius:14px;background:#33333f;position:relative;flex:0 0 auto;transition:background .2s"><span id="online-knob" style="position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s"></span></span>
    </div>

    <div class="earn">
      <div class="earn-lbl">Você ganhou esta semana</div>
      <div class="earn-big" id="earn-week">R$ 0,00</div>
      <div class="earn-row">
        <span>Hoje <b id="earn-today">R$ 0,00</b></span>
        <span>Entregas <b id="earn-count">0</b></span>
        <span>A receber <b id="earn-due">R$ 0,00</b></span>
      </div>
    </div>

    <div class="seg">
      <button class="active" id="seg-corridas" onclick="setSeg('corridas')">Corridas</button>
      <button id="seg-ganhos" onclick="setSeg('ganhos')">Ganhos</button>
    </div>

    <div id="view-corridas"><div id="corridas-list"></div></div>
    <div id="view-ganhos" class="hidden"><div id="ganhos-list"></div></div>
  </div>
</div>

<script>
const API = '/api/webhook';
const SK = 'drope_ent_session_v1';
let SESS = null; let _ganhos = null;
try { SESS = JSON.parse(localStorage.getItem(SK) || 'null'); } catch(e) {}

function _q(id){ return document.getElementById(id); }
function _togglePw(id, btn){ const i=document.getElementById(id); if(!i) return; const show=i.type==='password'; i.type=show?'text':'password'; if(btn) btn.innerHTML=show?'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M10 5.7A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a15 15 0 0 1-2.4 3.1M6.4 6.4A14.5 14.5 0 0 0 2.5 12S6 18.5 12 18.5a9.6 9.6 0 0 0 4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="M3 3l18 18"/></svg>':'<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg>'; }
function fmtBRL(c){ return 'R$ ' + ((c||0)/100).toFixed(2).replace('.', ','); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtPhoneStr(d){ d=String(d||'').replace(/\D/g,'').slice(0,11); if(d.length>=8)return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7); if(d.length>=3)return '('+d.slice(0,2)+') '+d.slice(2); return d; }
function fmtDay(iso){ try{ const d=new Date(iso); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }catch(e){ return ''; } }

function setTab(t){
  _q('tab-login').classList.toggle('active', t==='login');
  _q('tab-signup').classList.toggle('active', t==='signup');
  _q('form-login').classList.toggle('hidden', t!=='login');
  _q('form-signup').classList.toggle('hidden', t!=='signup');
  _q('auth-msg').textContent='';
}
function setSeg(s){
  _q('seg-corridas').classList.toggle('active', s==='corridas');
  _q('seg-ganhos').classList.toggle('active', s==='ganhos');
  _q('view-corridas').classList.toggle('hidden', s!=='corridas');
  _q('view-ganhos').classList.toggle('hidden', s!=='ganhos');
  if(s==='ganhos') renderGanhos();
}
['lg-phone','sg-phone'].forEach(id=>{ const e=_q(id); if(e) e.addEventListener('input', ev=>{ ev.target.value=fmtPhoneStr(ev.target.value); }); });

async function doSignup(){
  const nome=(_q('sg-nome').value||'').trim();
  const phone=(_q('sg-phone').value||'').replace(/\D/g,'');
  const pix_key=(_q('sg-pix').value||'').trim();
  const password=(_q('sg-pass').value||'');
  const msg=_q('auth-msg');
  if(nome.length<2){ msg.textContent='Informe seu nome'; return; }
  if(phone.length<10){ msg.textContent='Telefone inválido'; return; }
  if(password.length<4){ msg.textContent='Senha muito curta (mín. 4)'; return; }
  const b=_q('btn-signup'); b.disabled=true; b.textContent='Criando...';
  try{
    const r=await fetch(API+'?action=entregador_signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,phone,password,pix_key})});
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.ok){ SESS={entregador_id:d.entregador.id,nome:d.entregador.nome,token:d.token}; localStorage.setItem(SK,JSON.stringify(SESS)); showCorridas(); }
    else { msg.textContent=d.error||'Não deu pra cadastrar'; }
  }catch(e){ msg.textContent='Erro de rede'; }
  b.disabled=false; b.textContent='Criar conta ✦';
}
async function doLogin(){
  const phone=(_q('lg-phone').value||'').replace(/\D/g,'');
  const password=(_q('lg-pass').value||'');
  const msg=_q('auth-msg');
  if(phone.length<10||!password){ msg.textContent='Preencha telefone e senha'; return; }
  const b=_q('btn-login'); b.disabled=true; b.textContent='Entrando...';
  try{
    const r=await fetch(API+'?action=entregador_login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password})});
    const d=await r.json().catch(()=>({}));
    if(r.ok&&d.ok){ SESS={entregador_id:d.entregador.id,nome:d.entregador.nome,token:d.token}; localStorage.setItem(SK,JSON.stringify(SESS)); showCorridas(); }
    else { msg.textContent=d.error||'Não deu pra entrar'; }
  }catch(e){ msg.textContent='Erro de rede'; }
  b.disabled=false; b.textContent='Entrar ✦';
}
function sair(){ localStorage.removeItem(SK); SESS=null; location.reload(); }

function showCorridas(){
  _q('auth-screen').classList.add('hidden');
  _q('corridas-screen').classList.remove('hidden');
  _q('ent-nome').textContent='Oi, '+(SESS.nome||'Entregador')+' ✦';
  loadCorridas();
}

// ===== Online / Offline (ficar disponível) =====
let ONLINE=false;
function renderOnline(){
  const dot=_q('online-dot'), lbl=_q('online-label'), sub=_q('online-sub'), sw=_q('online-switch'), knob=_q('online-knob'), bar=_q('online-bar');
  if(!dot) return;
  if(ONLINE){ dot.style.background='#4ADE80'; dot.style.boxShadow='0 0 8px #4ADE80'; lbl.textContent='Online'; sub.textContent='Recebendo corridas ✦'; sw.style.background='#1f7a44'; knob.style.left='21px'; if(bar) bar.style.borderColor='rgba(74,222,128,.5)'; }
  else { dot.style.background='#6b6b7a'; dot.style.boxShadow='none'; lbl.textContent='Offline'; sub.textContent='Toque pra ficar disponível'; sw.style.background='#33333f'; knob.style.left='3px'; if(bar) bar.style.borderColor='var(--border)'; }
}
async function toggleOnline(){
  const prev=ONLINE; ONLINE=!ONLINE; renderOnline(); // otimista
  try{
    const r=await fetch(API+'?action=entregador_online',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entregador:SESS.entregador_id,token:SESS.token,online:ONLINE})});
    const d=await r.json().catch(()=>({}));
    if(!(r.ok&&d.ok)){ ONLINE=prev; renderOnline(); alert(d.error||'Não deu pra atualizar'); return; }
  }catch(e){ ONLINE=prev; renderOnline(); alert('Erro de rede'); return; }
  loadCorridas();
}
function fmtAgo(iso){ try{ const min=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000)); if(min<1)return'agora'; if(min<60)return'há '+min+' min'; const h=Math.floor(min/60); return 'há '+h+'h'; }catch(e){ return ''; } }

let _polling=null;
async function loadCorridas(){
  if(!SESS) return;
  try{
    const url=API+'?action=entregador_corridas&entregador='+encodeURIComponent(SESS.entregador_id)+'&token='+encodeURIComponent(SESS.token);
    const r=await fetch(url,{cache:'no-store'});
    if(r.status===401){ sair(); return; }
    const d=await r.json().catch(()=>({}));
    _ganhos=d.ganhos||null;
    _lastCorridas=d.corridas||[];
    if(d.entregador && typeof d.entregador.online==='boolean'){ ONLINE=d.entregador.online; renderOnline(); }
    renderGanhosSummary();
    // Não re-renderiza enquanto o entregador digita o código (não apaga o que ele digitou).
    if(_activePinCorrida==null) renderCorridas(_lastCorridas);
    if(!_q('view-ganhos').classList.contains('hidden')) renderGanhos();
  }catch(e){}
  if(!_polling) _polling=setInterval(loadCorridas,20000);
}

function renderGanhosSummary(){
  const g=_ganhos||{};
  _q('earn-week').textContent=fmtBRL(g.semana_cents);
  _q('earn-today').textContent=fmtBRL(g.hoje_cents);
  _q('earn-count').textContent=(g.entregas_semana||0);
  _q('earn-due').textContent=fmtBRL(g.a_receber_cents);
}

function renderCorridas(list){
  const el=_q('corridas-list');
  if(!list.length){ el.innerHTML = ONLINE
    ? '<div class="empty"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="5.5" cy="17.5" r="2.5"/><circle cx="17" cy="17.5" r="2.5"/><path d="M8 17.5h6.5l-3.3-8H8.2"/><path d="M11.2 9.5H15l2 5"/><path d="M3.5 9.5h3"/></svg> Nenhuma corrida agora.<br>Assim que rolar uma entrega, aparece aqui ✦</div>'
    : '<div class="empty">Você está <b>offline</b>.<br>Toque em <b>Ficar disponível</b> lá em cima pra receber corridas ✦</div>'; return; }
  list.sort((a,b)=>(b.mine?1:0)-(a.mine?1:0));
  el.innerHTML=list.map(c=>{
    const st = c.status==='aberta' ? '<span class="c-badge b-aberta">Disponível</span>'
      : c.status==='aceita' ? '<span class="c-badge b-aceita">Aceita</span>'
      : '<span class="c-badge b-rota">Saiu pra entrega</span>';
    const tipo = c.avulso ? '<span class="c-badge b-avulso">Avulso</span>' : '<span class="c-badge b-fixo">Loja fixa</span>';
    const maps=c.endereco?`<a class="maps" href="https://www.google.com/maps/search/${encodeURIComponent(c.endereco)}" target="_blank"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="m9 4-6 2.5v14L9 18l6 2.5L21 18V4l-6 2.5L9 4Z"/><path d="M9 4v14M15 6.5v14"/></svg> Mapa</a>`:'';
    const zap=c.cliente_phone?` · <a class="zap" href="https://wa.me/55${String(c.cliente_phone).replace(/\D/g,'').replace(/^55/,'')}" target="_blank">WhatsApp</a>`:'';
    const navBtns=`<a class="btn sec" style="flex:1 1 auto;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(c.endereco)}" target="_blank"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10.5c0 5.2-7 11-7 11s-7-5.8-7-11a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10.5" r="2.5"/></svg>Google Maps</a><a class="btn sec" style="flex:1 1 auto;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px" href="https://waze.com/ul?q=${encodeURIComponent(c.endereco)}&navigate=yes" target="_blank"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 1.5 3.5 1.5 3.5-1.5 3.5-1.5"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>Waze</a>`;
    let acts='', navRow='', gpsBlock='';
    if(c.status==='aberta'){
      acts=`<button class="btn" onclick="act(${c.id},'accept',this)">Aceitar corrida ✦</button><button class="btn sec" style="flex:0 0 auto;width:auto" onclick="act(${c.id},'recusar',this)">Recusar</button>`;
    } else if(c.status==='aceita'){
      navRow=`<div class="c-line" style="color:var(--fg-dim);font-size:13px;margin-top:2px">Escolha a navegação pra sair pra entrega:</div><div class="c-acts" style="margin-bottom:8px">
        <button class="btn" style="flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px" onclick="iniciarEntrega(${c.id},'maps',this)"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 10.5c0 5.2-7 11-7 11s-7-5.8-7-11a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10.5" r="2.5"/></svg>Google Maps</button>
        <button class="btn" style="flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px" onclick="iniciarEntrega(${c.id},'waze',this)"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5s1.2 1.5 3.5 1.5 3.5-1.5 3.5-1.5"/><path d="M9 9.5h.01M15 9.5h.01"/></svg>Waze</button></div>`;
      acts=`<button class="btn sec" style="flex:0 0 auto;width:auto" onclick="act(${c.id},'cancelar',this)">Devolver</button>`;
    } else if(c.status==='em_rota'){
      navRow=`<div class="c-acts" style="margin-bottom:8px">${navBtns}</div>`;
      if(_cheguei[c.id]){
        gpsBlock=`<div class="c-line" style="color:var(--fg-dim);font-size:13px">Peça o código de 4 dígitos ao cliente pra liberar o pedido:</div>
          <input id="pin-${c.id}" inputmode="numeric" maxlength="4" autocomplete="one-time-code" placeholder="0000" style="width:100%;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--fg);font-size:24px;letter-spacing:10px;text-align:center;font-family:'Space Grotesk',sans-serif;margin:4px 0 8px">`;
        acts=`<button class="btn pink" style="flex:1 1 100%" onclick="confirmarEntrega(${c.id})">Entreguei <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.6 2.6L16 9.4"/></svg></button>`;
      } else {
        gpsBlock=`<div class="c-line" id="gps-line-${c.id}" style="color:var(--lime);font-weight:600"><span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="4"/></svg></span><span>Ative a localização pra liberar as etapas</span></div>`;
        acts=`<button class="btn sec" id="btn-chegando-${c.id}" style="flex:1 1 auto;opacity:.45" disabled onclick="acChegando(${c.id},this)">Tô chegando</button>
          <button class="btn pink" id="btn-cheguei-${c.id}" style="flex:1 1 auto;opacity:.45" disabled onclick="acCheguei(${c.id})">Cheguei</button>
          <button class="btn sec" id="btn-forcar-${c.id}" style="flex:1 1 100%;display:none;margin-top:6px" onclick="forcarCheguei(${c.id})">Cheguei mesmo assim</button>`;
      }
    }
    return `<div class="card ${c.mine?'mine':''}">
      <div class="c-top"><span class="c-loja">${esc(c.loja)}</span><span class="c-valor">${fmtBRL(c.valor_cents)}</span></div>
      <div class="c-badges">${tipo}${st}</div>
      <div class="c-line"><span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg></span><span>Pedido #${esc(c.order_nsu)}</span></div>
      ${c.status==='aberta'&&(c.distancia_km||c.created_at)?`<div class="c-line"><span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M19 10.5c0 5.2-7 11-7 11s-7-5.8-7-11a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10.5" r="2.5"/></svg></span><span>${c.distancia_km?('~'+c.distancia_km+' km'):''}${c.distancia_km&&c.created_at?' · ':''}${c.created_at?('aberta '+fmtAgo(c.created_at)):''}</span></div>`:''}
      ${c.itens?`<div class="c-line"><span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3.5h2l2.3 12a1.5 1.5 0 0 0 1.5 1.2h8.4a1.5 1.5 0 0 0 1.5-1.2L20.5 7.5H6"/></svg></span><span>${esc(c.itens)}</span></div>`:''}
      <div class="c-line"><span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M19 10.5c0 5.2-7 11-7 11s-7-5.8-7-11a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10.5" r="2.5"/></svg></span><span><b>${esc(c.endereco||'Sem endereço')}</b></span></div>
      <div class="c-line"><span><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.8 3.2-6.2 7.5-6.2s7.5 2.4 7.5 6.2"/></svg></span><span>${esc(c.cliente_nome||'Cliente')} ${zap}</span></div>
      ${navRow}
      ${gpsBlock}
      <div class="c-acts">${acts}</div>
    </div>`;
  }).join('');
  try{ _afterRenderCorridas(list); }catch(e){}
}

// ===== Fluxo em etapas + rastreio por GPS (no app do entregador) =====
let _lastCorridas=[], _activePinCorrida=null, _gpsWatchId=null, _gpsPos=null, _gpsTick=null;
const _cheguei={}, _chegandoDone={}, _destCache={}, _destFetching={}, _nearSince={}, _emRotaSince={};
function _haversineKm(a,b){ const R=6371,toR=d=>d*Math.PI/180; const dLat=toR(b.lat-a.lat),dLng=toR(b.lng-a.lng); const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function _fmtDist(km){ return km<1 ? (Math.round(km*1000)+' m') : (km.toFixed(1)+' km'); }
async function _postAction(corridaId, action, extra){
  try{
    const r=await fetch(API+'?action=entregador_corrida_action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({entregador:SESS.entregador_id,token:SESS.token,corrida_id:corridaId,action},extra||{}))});
    const d=await r.json().catch(()=>({}));
    return {ok:r.ok&&d.ok,d};
  }catch(e){ return {ok:false,d:{error:'Erro de rede'}}; }
}
function _openNav(app,endereco){ const url=app==='waze'?('https://waze.com/ul?q='+encodeURIComponent(endereco)+'&navigate=yes'):('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(endereco)); try{ window.open(url,'_blank'); }catch(e){} }
async function iniciarEntrega(id, app, btn){
  const c=(_lastCorridas||[]).find(x=>x.id===id)||{};
  _openNav(app, c.endereco||'');
  if(btn) btn.disabled=true;
  const {ok,d}=await _postAction(id,'sai');
  if(!ok){ if(btn) btn.disabled=false; alert(d.error||'Não deu pra iniciar a entrega'); return; }
  loadCorridas(); // vira em_rota → começa o GPS
}
async function acChegando(id, btn){
  if(btn){ btn.disabled=true; btn.textContent='...'; }
  const {ok,d}=await _postAction(id,'chegando');
  if(ok){ _chegandoDone[id]=true; if(btn){ btn.textContent='Cliente avisado ✓'; } }
  else { if(btn){ btn.disabled=false; btn.textContent='Tô chegando'; } alert(d.error||'Não deu'); }
}
async function acCheguei(id){
  const {ok,d}=await _postAction(id,'chegou');
  if(!ok){ alert(d.error||'Não deu'); return; }
  _cheguei[id]=true; _activePinCorrida=id;
  renderCorridas(_lastCorridas);
  setTimeout(()=>{ const el=document.getElementById('pin-'+id); if(el) el.focus(); }, 120);
}
function forcarCheguei(id){ if(confirm('Confirmar que você chegou no endereço do cliente?')) acCheguei(id); }
async function confirmarEntrega(id){
  const el=document.getElementById('pin-'+id); const pin=((el&&el.value)||'').trim();
  if(pin.length<4){ alert('Digite o código de 4 dígitos que o cliente mostra ✦'); if(el) el.focus(); return; }
  const {ok,d}=await _postAction(id,'entregue',{pin});
  if(!ok){ alert(d.error||'Código incorreto ✦'); if(el){ el.value=''; el.focus(); } return; }
  _activePinCorrida=null; _cheguei[id]=false;
  loadCorridas();
}
function _startGps(){
  if(_gpsWatchId!=null || !navigator.geolocation) return;
  _gpsWatchId=navigator.geolocation.watchPosition(
    p=>{ _gpsPos={lat:p.coords.latitude,lng:p.coords.longitude}; _updateGpsUI(); },
    ()=>{ _gpsPos=null; _updateGpsUI(); },
    { enableHighAccuracy:true, maximumAge:8000, timeout:20000 }
  );
  if(!_gpsTick) _gpsTick=setInterval(_updateGpsUI, 10000);
}
function _stopGps(){ if(_gpsWatchId!=null && navigator.geolocation) navigator.geolocation.clearWatch(_gpsWatchId); _gpsWatchId=null; if(_gpsTick){ clearInterval(_gpsTick); _gpsTick=null; } }
async function _ensureDest(c){
  if(_destCache[c.id] || _destFetching[c.id]) return;
  const cep=String(c.cep||'').replace(/\D/g,''); if(cep.length!==8) return;
  _destFetching[c.id]=true;
  try{ const r=await fetch(API+'?action=cep_geo&cep='+cep,{cache:'no-store'}); const d=await r.json().catch(()=>({})); if(d&&d.ok&&d.lat&&d.lng){ _destCache[c.id]={lat:d.lat,lng:d.lng}; _updateGpsUI(); } }catch(e){}
}
function _afterRenderCorridas(list){
  const ativos=(list||[]).filter(c=>c.status==='em_rota' && !_cheguei[c.id]);
  if(ativos.length){ _startGps(); ativos.forEach(c=>{ if(!_emRotaSince[c.id]) _emRotaSince[c.id]=Date.now(); _ensureDest(c); }); _updateGpsUI(); }
  else _stopGps();
}
function _updateGpsUI(){
  (_lastCorridas||[]).forEach(c=>{
    if(c.status!=='em_rota' || _cheguei[c.id]) return;
    const line=document.getElementById('gps-line-'+c.id);
    const bChe=document.getElementById('btn-chegando-'+c.id);
    const bCheg=document.getElementById('btn-cheguei-'+c.id);
    const bForce=document.getElementById('btn-forcar-'+c.id);
    const dest=_destCache[c.id];
    let dist=null; if(_gpsPos && dest) dist=_haversineKm(_gpsPos,dest);
    if(dist!=null && dist<0.5 && !_nearSince[c.id]) _nearSince[c.id]=Date.now();
    if(line){ const sp=line.querySelector('span:last-child'); if(sp) sp.textContent = dist!=null ? ('Você está a ~'+_fmtDist(dist)+' do cliente') : (_gpsPos?'Calculando distância…':'Ative a localização pra liberar as etapas'); }
    if(bChe && !_chegandoDone[c.id]){ const en=(dist!=null && dist<1); bChe.disabled=!en; bChe.style.opacity=en?'1':'.45'; }
    if(bChe && _chegandoDone[c.id]){ bChe.disabled=true; bChe.style.opacity='1'; bChe.textContent='Cliente avisado ✓'; }
    if(bCheg){ const en=(dist!=null && dist<0.15); bCheg.disabled=!en; bCheg.style.opacity=en?'1':'.45'; }
    const nearOk=_nearSince[c.id] && (Date.now()-_nearSince[c.id]>120000);
    const noGpsOk=!_gpsPos && _emRotaSince[c.id] && (Date.now()-_emRotaSince[c.id]>120000);
    if(bForce) bForce.style.display=((nearOk||noGpsOk) && bCheg && bCheg.disabled)?'block':'none';
  });
}

function renderGanhos(){
  const el=_q('ganhos-list'); const g=_ganhos||{};
  const hist=g.historico||[];
  if(!hist.length){ el.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="12" cy="12" r="9"/><path d="M12 7.2v9.6"/><path d="M14.6 9.5c-.5-.9-1.4-1.4-2.6-1.4-1.5 0-2.6.8-2.6 2 0 2.7 5.2 1.4 5.2 4 0 1.2-1.1 2-2.6 2-1.2 0-2.1-.5-2.6-1.4"/></svg> Suas entregas concluídas vão aparecer aqui com o valor de cada uma ✦</div>'; return; }
  el.innerHTML=hist.map(h=>`<div class="hist-item">
    <div style="min-width:0"><div class="hist-loja">${esc(h.loja)}</div><div class="hist-when">${fmtDay(h.delivered_at)}</div></div>
    <div class="hist-val">+ ${fmtBRL(h.valor_cents)}</div>
  </div>`).join('');
}

async function act(corridaId, action, btn){
  if(action==='cancelar' && !confirm('Devolver essa corrida?')) return;
  let pin='';
  if(action==='entregue'){
    pin=(prompt('Código de entrega — peça os 4 dígitos ao cliente:')||'').trim();
    if(!pin) return; // cancelou
  }
  if(btn){ btn.disabled=true; btn._old=btn.innerHTML; btn.textContent='...'; }
  let ok=false;
  try{
    const r=await fetch(API+'?action=entregador_corrida_action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entregador:SESS.entregador_id,token:SESS.token,corrida_id:corridaId,action,pin})});
    const d=await r.json().catch(()=>({}));
    ok = r.ok && d.ok;
    if(!ok) alert(d.error||'Não deu pra atualizar');
  }catch(e){ alert('Erro de rede'); }
  // Avisos (chegando/chegou) não mudam a corrida: confirma no botão e não recarrega.
  if(ok && (action==='chegando'||action==='chegou')){
    if(btn){ btn.textContent='Cliente avisado ✓'; setTimeout(()=>{ btn.disabled=false; btn.innerHTML=btn._old||'ok'; }, 1800); }
    return;
  }
  if(btn){ btn.disabled=false; btn.innerHTML=btn._old||'ok'; }
  loadCorridas();
}

if(SESS && SESS.token) showCorridas();
</script>
