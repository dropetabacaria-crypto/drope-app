<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drope Admin — Pendentes</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, system-ui, sans-serif; background: #0a0a0a; color: #eee; margin: 0; padding: 20px; }
  h1 { color: #c4ff00; margin: 0 0 10px; }
  h2 { color: #e879f9; border-bottom: 1px solid #333; padding-bottom: 6px; margin: 30px 0 14px; font-size: 18px; }
  .top-bar { position: sticky; top: 0; background: #0a0a0a; padding: 12px 0; border-bottom: 2px solid #c4ff00; z-index: 10; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .badge { background: #c4ff00; color: #000; padding: 3px 10px; border-radius: 12px; font-weight: bold; font-size: 13px; }
  button { background: #c4ff00; color: #000; border: none; padding: 8px 14px; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 13px; }
  button:hover { background: #fff; }
  button.refazer { background: #f59e0b; }
  button.excluir { background: #ef4444; color: #fff; }
  button.cinza { background: #444; color: #eee; }
  input[type="text"], input[type="number"] { background: #1a1a1a; color: #eee; border: 1px solid #333; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
  .card { background: #1a1a1a; border-radius: 8px; padding: 14px; border: 2px solid #2a2a2a; margin-bottom: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
  .card-name { font-weight: bold; font-size: 16px; }
  .card-meta { color: #888; font-size: 12px; }
  .imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .img-box { background: #fff; border-radius: 4px; padding: 4px; text-align: center; }
  .img-box img { width: 100%; height: 130px; object-fit: contain; border-radius: 2px; }
  .img-box .label { font-size: 10px; color: #444; margin-top: 4px; font-weight: bold; }
  .img-box.empty { background: #2a2a2a; color: #666; display: flex; align-items: center; justify-content: center; height: 142px; font-size: 11px; }
  .specs { font-size: 12px; color: #aaa; margin: 8px 0; }
  .specs span { margin-right: 12px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .actions input[type="number"] { width: 90px; }
  .login { display: flex; flex-direction: column; gap: 10px; max-width: 320px; padding: 30px; }
  .login input { font-size: 16px; padding: 10px; }
  .empty-state { text-align: center; padding: 40px; color: #888; font-size: 14px; }
  .grupo-modelo { background: #14141c; border-left: 3px solid #e879f9; padding: 10px 14px; margin: 24px 0 8px; border-radius: 4px; }
  .grupo-modelo strong { color: #c4ff00; }
</style>
</head>
<body>
<h1><img src="icons/camaleao-olho.webp" alt="DROPE" style="width:1em;height:1em;border-radius:50%;object-fit:cover;vertical-align:-.18em;display:inline-block;flex:0 0 auto"> Drope Admin — Pendentes de Aprovação</h1>

<div id="login" class="login" style="display:none;">
  <p>Cole o ADMIN_TOKEN:</p>
  <input type="text" id="tokenInput" placeholder="ADMIN_TOKEN">
  <button onclick="login()">Entrar</button>
</div>

<div id="app" style="display:none;">
  <div class="top-bar">
    <span class="badge" id="totalBadge">0 pendentes</span>
    <button onclick="reload()"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M20 11a8 8 0 0 0-14-4.5L3.5 9"/><path d="M4 5v4h4"/><path d="M4 13a8 8 0 0 0 14 4.5L20.5 15"/><path d="M20 19v-4h-4"/></svg> Atualizar</button>
    <button class="cinza" onclick="approveAll()"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.6 2.6L16 9.4"/></svg> Aprovar TODOS</button>
    <button class="cinza" onclick="logout()" style="margin-left:auto;">Sair</button>
  </div>
  <div id="conteudo"></div>
</div>

<script>
const TOKEN_KEY = 'drope_admin_token';
let token = localStorage.getItem(TOKEN_KEY) || '';

function login() {
  const v = document.getElementById('tokenInput').value.trim();
  if (!v) return;
  localStorage.setItem(TOKEN_KEY, v);
  token = v;
  showApp();
}
function logout() {
  localStorage.removeItem(TOKEN_KEY);
  token = '';
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}
function showApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  reload();
}

async function api(path, opts = {}) {
  const url = path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token);
  const r = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json', 'x-admin-token': token, ...(opts.headers || {}) } });
  if (r.status === 401) { logout(); throw new Error('Unauthorized'); }
  return await r.json();
}

async function reload() {
  document.getElementById('conteudo').innerHTML = '<div class="empty-state">Carregando...</div>';
  try {
    const data = await api('/api/admin-list-pending');
    document.getElementById('totalBadge').textContent = (data.total || 0) + ' pendentes';
    render(data);
  } catch (e) {
    document.getElementById('conteudo').innerHTML = '<div class="empty-state">Erro: ' + e.message + '</div>';
  }
}

function fmtPrice(cents) {
  if (!cents) return '';
  return 'R$ ' + (cents / 100).toFixed(2).replace('.', ',');
}

function thermometer(prod) {
  const dots = (n) => '●'.repeat(n||0) + '○'.repeat(5-(n||0));
  return `<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="12" cy="12" r="3.5"/><path d="M9 10.5 5 8l1 4-2.5 2.2 3.5.8M15 13.5l4 2.5-1-4 2.5-2.2-3.5-.8"/></svg> ${dots(prod.flavor_sweet)}  <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg> ${dots(prod.flavor_ice)}  <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M6.5 14c-2-4 1-9 6-9 3 0 5.5 2 6.5 5s-1 8-6.5 8c-3 0-5-2-6-4Z"/><path d="M9.5 8c-1 1-1.5 2.5-1.5 4"/></svg> ${dots(prod.flavor_sour)}`;
}

function imgBox(url, label) {
  if (url) return `<div class="img-box"><img src="${url}" loading="lazy"><div class="label">${label}</div></div>`;
  return `<div class="img-box empty">${label}<br>(sem foto)</div>`;
}

function cardHTML(p) {
  const meta = p.metadata || {};
  return `
    <div class="card" data-id="${p.id}">
      <div class="card-head">
        <div>
          <input type="text" id="name-${p.id}" value="${(p.name || '').replace(/"/g, '&quot;')}" style="width: 380px; max-width:100%; font-weight: bold; font-size: 14px; background: #14141c;">
          <div class="card-meta">#${p.id} • ${p.slug || ''} • criado ${(p.created_at || '').slice(0,10)}</div>
        </div>
        <div class="card-meta">qty: ${p.qty_available || 0}</div>
      </div>
      <div class="imgs">
        ${imgBox(p.box_photo_url, '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg> caixa real')}
        ${imgBox(p.reference_image_url, '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.8-3.8"/></svg> referência')}
        ${imgBox(p.image_url, '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 2-2 0-1.5 1-2 2.2-2H18a3 3 0 0 0 3-3c0-5-4-9-9-9Z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/><circle cx="16.5" cy="11" r="1"/></svg> arte final')}
      </div>
      <div class="specs" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
        <label><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M3 9h11a3 3 0 1 0-3-3"/><path d="M3 13h15a3 3 0 1 1-3 3"/><path d="M3 17h7"/></svg> puffs<br><input type="number" id="puffs-${p.id}" value="${p.puffs || ''}" placeholder="ex: 15000" style="width:100%;"></label>
        <label><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><rect x="3" y="8" width="16" height="9" rx="2"/><path d="M21 11v3"/><rect x="5.5" y="10.5" width="8" height="4" rx="1" fill="currentColor" stroke="none"/></svg> bateria<br><input type="text" id="battery-${p.id}" value="${p.battery || ''}" placeholder="ex: 650mAh" style="width:100%;"></label>
        <label><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M12 3s6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 12 3 12 3Z"/></svg> líquido<br><input type="text" id="liquid-${p.id}" value="${p.liquid_ml || ''}" placeholder="ex: 20ml" style="width:100%;"></label>
        <label><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/></svg> nicotina<br><input type="text" id="nicotine-${p.id}" value="${p.nicotine || ''}" placeholder="ex: 5%" style="width:100%;"></label>
      </div>
      <div class="specs" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
        <label><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="12" cy="12" r="3.5"/><path d="M9 10.5 5 8l1 4-2.5 2.2 3.5.8M15 13.5l4 2.5-1-4 2.5-2.2-3.5-.8"/></svg> doce (0-5)<br><input type="number" min="0" max="5" id="sweet-${p.id}" value="${p.flavor_sweet ?? ''}" style="width:100%;"></label>
        <label><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg> ice (0-5)<br><input type="number" min="0" max="5" id="ice-${p.id}" value="${p.flavor_ice ?? ''}" style="width:100%;"></label>
        <label><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M6.5 14c-2-4 1-9 6-9 3 0 5.5 2 6.5 5s-1 8-6.5 8c-3 0-5-2-6-4Z"/><path d="M9.5 8c-1 1-1.5 2.5-1.5 4"/></svg> sour (0-5)<br><input type="number" min="0" max="5" id="sour-${p.id}" value="${p.flavor_sour ?? ''}" style="width:100%;"></label>
      </div>
      <div class="specs">${thermometer(p)}</div>
      <div class="specs"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M4 20h16"/><path d="M14.5 5.5l4 4-9 9H5.5v-4l9-9Z"/></svg> <input type="text" id="desc-${p.id}" value="${(p.description || '').replace(/"/g, '&quot;')}" placeholder="descrição curta (max 60)" maxlength="80" style="width:90%;"></div>
      <div class="actions">
        <span>R$:</span>
        <input type="number" step="0.01" placeholder="venda" id="venda-${p.id}" value="${p.price_cents ? (p.price_cents/100).toFixed(2) : ''}">
        <input type="number" step="0.01" placeholder="custo" id="custo-${p.id}" value="${p.cost_price || ''}">
        <button class="cinza" onclick="saveSpecs(${p.id})"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M5 4h11l3 3v13H5V4Z"/><path d="M8 4v5h7"/><rect x="8" y="13" width="8" height="6"/></svg> Salvar specs</button>
        <button onclick="approve(${p.id})"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.6 2.6L16 9.4"/></svg> Aprovar</button>
        <button class="refazer" onclick="regenerate(${p.id})"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M20 11a8 8 0 0 0-14-4.5L3.5 9"/><path d="M4 5v4h4"/><path d="M4 13a8 8 0 0 0 14 4.5L20.5 15"/><path d="M20 19v-4h-4"/></svg> Refazer arte</button>
        <button class="excluir" onclick="reject(${p.id})"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg> Excluir</button>
      </div>
    </div>
  `;
}

async function saveSpecs(id) {
  const body = { id, action: 'update_specs' };
  const get = (k) => document.getElementById(`${k}-${id}`).value;
  const num = (v) => v === '' ? null : parseFloat(v);
  const intg = (v) => v === '' ? null : parseInt(v);
  const name = get('name'); if (name && name.trim()) body.name = name.trim();
  const puffs = intg(get('puffs')); if (puffs > 0) body.puffs = puffs;
  const battery = get('battery'); if (battery && battery.trim()) body.battery = battery.trim();
  const liquid = get('liquid'); if (liquid && liquid.trim()) body.liquid_ml = liquid.trim();
  const nicotine = get('nicotine'); if (nicotine && nicotine.trim()) body.nicotine = nicotine.trim();
  const desc = get('desc'); body.description = desc ? desc.trim() : '';
  const sw = intg(get('sweet')); if (sw != null && sw >= 0 && sw <= 5) body.flavor_sweet = sw;
  const ic = intg(get('ice')); if (ic != null && ic >= 0 && ic <= 5) body.flavor_ice = ic;
  const so = intg(get('sour')); if (so != null && so >= 0 && so <= 5) body.flavor_sour = so;
  await api('/api/admin-approve-product', { method: 'POST', body: JSON.stringify(body) });
  alert('Specs salvas.');
}

function render(data) {
  const cont = document.getElementById('conteudo');
  if (!data.products || data.products.length === 0) {
    cont.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M3 20 8 8l8 8-13 4Z"/><path d="M9 9c1-2 .5-4-1-5M13 6c2-1 4 0 5 2M15 3v0M20 8v0M20.5 13v0"/></svg> Nenhum produto pendente. Tudo no app.</div>';
    return;
  }
  let html = '';
  for (const grupo of (data.grouped || [])) {
    html += `<div class="grupo-modelo"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em;flex:0 0 auto"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg> <strong>${grupo.brand} ${grupo.model}</strong> — ${grupo.products.length} sabores pendentes</div>`;
    for (const p of grupo.products) html += cardHTML(p);
  }
  cont.innerHTML = html;
}

async function approve(id) {
  const venda = parseFloat(document.getElementById('venda-' + id).value);
  const custo = parseFloat(document.getElementById('custo-' + id).value);
  const body = { id, action: 'approve' };
  if (venda > 0) body.price_cents = Math.round(venda * 100);
  if (custo > 0) body.cost_price = custo;
  await api('/api/admin-approve-product', { method: 'POST', body: JSON.stringify(body) });
  await reload();
}

async function reject(id) {
  if (!confirm('Excluir esse produto?')) return;
  await api('/api/admin-approve-product', { method: 'POST', body: JSON.stringify({ id, action: 'reject' }) });
  await reload();
}

async function regenerate(id) {
  await api('/api/admin-approve-product', { method: 'POST', body: JSON.stringify({ id, action: 'regenerate_art' }) });
  alert('Pipeline de arte disparada. Aguarda uns 30s e atualiza.');
}

async function approveAll() {
  if (!confirm('Aprovar TODOS os produtos pendentes (sem revisar individualmente)?')) return;
  const r = await api('/api/admin-approve-product', { method: 'POST', body: JSON.stringify({ action: 'approve_all' }) });
  alert(`${r.updated} produtos aprovados.`);
  await reload();
}

if (token) showApp();
else document.getElementById('login').style.display = 'flex';
</script>
</body>
</html>
